name: poetry_mate
description: "Poetry Mate —— 中国古典诗词阅读与 AI 赏析"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# drift_dev 2.34.x 声明 sqlparser ^0.44.0 却与 0.44.6 不兼容(DartPlaceholder.when 被移除),钉回 0.44.5
dependency_overrides:
  sqlparser: 0.44.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  es_compression: ^2.0.15
  path: ^1.9.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # 霞鹜文楷 GB 语料子集(15,069 字形, 覆盖出货文本+原文; 扩展B/F罕见变体走系统回退)
  # 再生成方法见 etl/docs/font-charset.txt 同目录说明
  fonts:
    - family: LXGW WenKai GB
      fonts:
        - asset: assets/fonts/LXGWWenKaiGB-Regular.ttf

  assets:
    - assets/seed/
    - assets/personas/
