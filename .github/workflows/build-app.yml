# Poetry Mate APP 打包流水线
#
# 产出:
#   - Android: release APK(可选 AAB) —— 必须使用固定 release keystore 签名
#   - iOS: 未签名 device .app + .ipa(无需任何 Apple 密钥);提供 Apple 签名密钥后可产出正式签名 IPA
#
# 触发:
#   - 手动 workflow_dispatch(可指定数据源地址 / 是否打 AAB / 是否跳过测试)
#   - 推送 v* tag 自动构建
#
# 必需 secrets:
#   Android 签名:
#     ANDROID_KEYSTORE_BASE64   —— keystore 文件的 base64(如 base64 -i key.jks)
#     ANDROID_KEYSTORE_PASSWORD —— storePassword
#     ANDROID_KEY_ALIAS         —— keyAlias
#     ANDROID_KEY_PASSWORD      —— keyPassword
#   iOS 签名(不配置则产出未签名 ipa):
#     IOS_CERTIFICATE_BASE64         —— Apple 分发证书 .p12 的 base64
#     IOS_CERTIFICATE_PASSWORD       —— .p12 密码
#     IOS_PROVISIONING_PROFILE_BASE64 —— .mobileprovision 的 base64
#     IOS_TEAM_ID                    —— Apple Developer Team ID
#     IOS_EXPORT_METHOD              —— app-store-connect / ad-hoc / development(默认 ad-hoc)
#
# 说明:
#   - iOS 构建必须在 macOS runner 上执行;Android 在 ubuntu 上执行。
#   - 产物通过 Actions Artifact 下载,保留 14 天。

name: build-app

on:
  workflow_dispatch:
    inputs:
      data_url:
        description: "数据源根地址,作为 --dart-define=POETRY_MATE_DATA_URL 注入(留空则不注入)"
        required: false
        default: ""
      build_appbundle:
        description: "同时构建 Android App Bundle(.aab)"
        type: boolean
        default: false
      run_tests:
        description: "构建前运行 flutter analyze + flutter test"
        type: boolean
        default: true
      release_tag:
        description: "发布到 GitHub Release 的 tag(如 v1.0.0;留空则不发布,只留 Artifacts)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_URL: ${{ inputs.data_url || '' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # 发布包禁止回退到每次 runner 都可能不同的 debug keystore。
      POETRY_MATE_REQUIRE_RELEASE_SIGNING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        if: ${{ inputs.run_tests != false }}
        working-directory: app
        run: flutter analyze

      - name: Test
        if: ${{ inputs.run_tests != false }}
        working-directory: app
        run: flutter test

      # 注入发布签名。发布流水线缺少固定 keystore 时必须失败，禁止回退 debug 签名。
      - name: Configure Android release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?未配置 ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?未配置 ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?未配置 ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?未配置 ANDROID_KEY_PASSWORD}"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/android/key.jks
          cat > app/android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          # 尽早验证 base64、store password 和 alias，避免构建出不可更新的包。
          keytool -list \
            -keystore app/android/key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null
          echo "Android release keystore 已加载"

      - name: Build APK
        working-directory: app
        run: |
          set -euo pipefail
          CMD=(flutter build apk --release)
          if [[ -n "$DATA_URL" ]]; then
            CMD+=(--dart-define=POETRY_MATE_DATA_URL="$DATA_URL")
          fi
          "${CMD[@]}"

      - name: Verify Android release signature
        working-directory: app
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Build App Bundle (optional)
        if: ${{ inputs.build_appbundle == true }}
        working-directory: app
        run: |
          set -euo pipefail
          CMD=(flutter build appbundle --release)
          if [[ -n "$DATA_URL" ]]; then
            CMD+=(--dart-define=POETRY_MATE_DATA_URL="$DATA_URL")
          fi
          "${CMD[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poetry-mate-android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA
    runs-on: macos-latest
    env:
      # secrets 上下文不能用于 step 的 if 表达式,通过 job 级 env 透传
      APPLE_CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Xcode
        run: |
          flutter --version
          xcodebuild -version

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        if: ${{ inputs.run_tests != false }}
        working-directory: app
        run: flutter analyze

      - name: Test
        if: ${{ inputs.run_tests != false }}
        working-directory: app
        run: flutter test

      # 未配置 Apple 签名密钥时,打未签名 device .app 与 .ipa;
      # 它们可以被开发者后续自行签名/重签名后安装或分发。
      - name: Build iOS (unsigned)
        if: ${{ env.APPLE_CERT == '' }}
        working-directory: app
        run: |
          set -euo pipefail
          CMD=(flutter build ios --release --no-codesign)
          if [[ -n "$DATA_URL" ]]; then
            CMD+=(--dart-define=POETRY_MATE_DATA_URL="$DATA_URL")
          fi
          "${CMD[@]}"
          CMD=(flutter build ipa --release --no-codesign)
          if [[ -n "$DATA_URL" ]]; then
            CMD+=(--dart-define=POETRY_MATE_DATA_URL="$DATA_URL")
          fi
          "${CMD[@]}"

      # 配置 Apple 签名密钥时,导入证书与描述文件并产出正式签名 IPA。
      - name: Configure iOS signing
        if: ${{ env.APPLE_CERT != '' }}
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERT_PASSWORD:?IOS_CERTIFICATE_PASSWORD 未配置}"
          : "${PROVISIONING_B64:?IOS_PROVISIONING_PROFILE_BASE64 未配置}"
          : "${TEAM_ID:?IOS_TEAM_ID 未配置}"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERT" | base64 --decode > "$CERT_PATH"

          # 描述文件放入系统目录
          PROFILE_UUID=$(uuidgen)
          printf '%s' "$PROVISIONING_B64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # 导入证书到钥匙串
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p temp "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp "$KEYCHAIN"

          # 生成 export options
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD:-ad-hoc}</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST

      - name: Build iOS (signed)
        if: ${{ env.APPLE_CERT != '' }}
        working-directory: app
        run: |
          set -euo pipefail
          CMD=(flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist")
          if [[ -n "$DATA_URL" ]]; then
            CMD+=(--dart-define=POETRY_MATE_DATA_URL="$DATA_URL")
          fi
          "${CMD[@]}"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: poetry-mate-ios
          path: |
            app/build/ios/iphoneos/*.app
            app/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: poetry-mate-android
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: poetry-mate-ios
          path: artifacts/ios

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 确定发布 tag: tag push 事件用 ref_name;手动触发用 release_tag 输入。
          TAG=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "未提供 tag,跳过 GitHub Release 发布(产物保留在 Artifacts)。"
            exit 0
          fi

          # 收集可安装产物: APK/AAB/IPA,以及打包成 zip 的 iOS .app
          mapfile -t FILES < <(
            find artifacts -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) | sort
          )
          APP_DIR="$(find artifacts -type d -name '*.app' | head -n 1 || true)"
          if [[ -n "$APP_DIR" ]]; then
            (
              cd "$(dirname "$APP_DIR")"
              zip -q -r "$RUNNER_TEMP/poetry-mate-ios-app.zip" "$(basename "$APP_DIR")"
            )
            FILES+=("$RUNNER_TEMP/poetry-mate-ios-app.zip")
          fi
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "没有可发布的产物文件"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            for f in "${FILES[@]}"; do
              gh release upload "$TAG" "$f" --clobber
            done
            echo "已更新已有 Release: $TAG"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --generate-notes --title "Poetry Mate $TAG"
            echo "已创建 Release: $TAG"
          fi
