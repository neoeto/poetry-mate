schema: spec-driven

# 项目上下文 —— 在生成任何交付物时提供给 AI
context: |
  # Poetry Mate —— 中国古诗词阅读与 AI 赏析手机应用

  定位: 面向普通诗词爱好者的诗词阅读应用。产品角色是"图书馆员"——帮用户找到诗、读懂诗,
  不评判、不代笔。明确不涉及: 写诗辅助、格律检查。

  核心产品设定:
  - Local-first: 诗词数据全量存于手机本地 SQLite;唯一云依赖是用户自配的 LLM API
  - BYOK: 用户自备 OpenAI 兼容供应商的 API Key,APP 直连 LLM,流量不经过自有后端
  - 首屏 = 今日推荐(LLM 每日策展一次并配推荐语) + 无限流(纯本地排序) + 传统检索(FTS) + AI 兜底检索
  - 阅读页采用三层渐进披露: 点句即释(行内浮出) → 结构化赏析(标签页) → 追问对话(最后手段)
  - LLM 生成的赏析永久缓存为「个人注本」——是用户资产,可编辑,不可被静默覆盖
  - AI 人格系统: 先生/知音/词客 三选一,默认知音;人格仅作用于 AI 内容层,不影响 UI 文案
  - 幻觉护栏: 赏析重心放在文本内艺术分析(炼字/意象/结构);创作背景类史实断言须标注不确定性
  - 推荐池分层: 名篇层(rank 热度 top) → 代表作层(按诗人分组取 top N) → 长尾层(仅供 AI 检索进入)
  - 无 LLM Key 也是完整读者: 阅读/检索/收藏全功能可用;AI 能力未配置时温和引导,不报错不置灰

  排版工艺(v1 已定):
  - 字体双轨制: 诗词正文/序/注释用霞鹜文楷(构建期字体子集化: 语料字符集∪通用规范汉字表8105字,
    罕见字回退系统字体),界面层用系统黑体——反差即设计语言("现代的壳,古典的心")
  - 版式: 一句一行左对齐(忌居中——词的长短句会锯齿状跳动)、正文大字号22~28sp、行距1.9~2.2倍、
    序文缩小一号降灰度呈现、分隔只用留白+一根细线;装饰纪律=零图片零插画零背景
  - 白文模式: 展示层去标点开关,v1 必做(近零成本,给深度用户句读自练的乐趣)
  - 古籍直排(竖排): v2 招牌特性候选,Flutter 无原生支持需自绘列布局,单独立项探索,勿顺手塞入某版本

  冷启动设定:
  - APP 内置种子集(ETL 产出的 rank 全局 top ~300,几百KB 资产),开箱即可读,
    导入向导是"扩张书架"而非初始化步骤
  - 内容寻址 ID 保证种子集与后续导入全集无缝续接收藏/笔记(同文同 ID,零迁移逻辑)
  - catalog 版本检查仅在打开导入向导或手动刷新时进行,绝不后台轮询

  技术栈:
  - 客户端: Flutter (Android / iOS)
  - 本地存储: SQLite + FTS5 全文检索
  - 后端: Cloudflare Worker + R2 —— 仅承担数据分发职责,绝不代理 LLM 流量
  - 数据源: github.com/chinese-poetry/chinese-poetry (MIT 协议开源数据库)
  - ETL: GitHub Actions 构建流水线(OpenCC 繁→简、schema 统一、稳定 ID 生成、rank 热度关联、zstd 压缩分包)
  - LLM: 用户自配 OpenAI 兼容供应商(DeepSeek/豆包/SiliconFlow 等)

  服务端/APP 端分工 —— 总原则: 服务端只存放公共品,对"用户"这个概念一无所知
  (无账号表、无行为日志);图书馆员(AI 能力)和用户的笔记都住在手机里。

  数据归属:
  - 存服务端(R2 分发): 版本化诗词数据包、manifest+sha256、aliases.json、current 版本指针
  - 仅存 APP 本地(SQLite/配置): 全量诗库+FTS索引、「个人注本」(AI赏析缓存+用户批注)、
    收藏/阅读历史/偏好、LLM 配置(baseURL/API Key)
  - 安全红线: API Key 与个人注本任何代码路径不得外发;隐私是架构而非策略——没有上传通道
  - 今日推荐(LLM 每日策展)发生在手机端: 调用用户自己的 key + 本地候选池,
    服务端不参与策展;无限流排序纯本地算法(rank×偏好×去重),零云端成本
  - 人格 prompt 模板打进 APP 安装包随版本更新,不经服务端分发
  - 已知代价: 无使用统计/崩溃可见性;将来若需匿名上报或第三方 Sentry 属独立决策,须明确征求同意
  - 未来线头(v2+,勿在 v1 架构上做死): 注本导出文件(必做)→端到端加密云备份(可选)、
    共享注本/UGC(需质量控制)、用户自愿上报刷新 rank 热度(与红线冲突,单独权衡)

  已定关键决策:
  - 诗词 ID 采用内容寻址: sha256(规范化正文) 前 128bit;配套别名表(poem_alias)吸收上游文本修订漂移
  - ETL 在云端构建期一次性完成,手机端只消费成品数据包,零转换逻辑
  - Worker 必须绑定自定义域名(workers.dev 默认域名在国内可达性差)

  语言约定: 与用户交流用中文;代码标识符用英文,注释和文档用中文。

rules:
  proposal:
    - 必须包含 Non-goals 部分
    - 涉及新数据存储的变更必须说明数据落在服务端还是 APP 端,并与上方"数据归属"保持一致
  tasks:
    - 任务按阶段分组,每组可独立验证
